<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Route Analyzer — Миасс → Екатеринбург</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Наши стили -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>

    <!-- Заголовок -->
    <header class="app-header">
        <div class="header-content">
            <h1>Route Analyzer</h1>
            <p class="subtitle">Миасс → Екатеринбург · цифровая модель местности · CAN-данные · ИИ-восстановление</p>
        </div>
    </header>

        <!-- Основная область: карта + панель -->
        <!-- Основная область -->
    <main class="app-main">

        <!-- Карта (слева, на всю высоту) -->
        <div class="map-wrapper">
            <div id="map"></div>

            <div class="controls">
                <button id="btn-start" class="btn btn-primary" title="Запустить анимацию">
                    ▶ Старт
                </button>
                <button id="btn-pause" class="btn btn-secondary" title="Пауза" disabled>
                    ⏸ Пауза
                </button>
                <button id="btn-reset" class="btn btn-secondary" title="В начало">
                    ⟲ Сброс
                </button>

                <div class="speed-control">
                    <label for="speed-slider">Скорость:</label>
                    <input type="range" id="speed-slider" min="1" max="200" value="10" step="1" />
                    <span id="speed-value" class="speed-value">×10</span>
                </div>
            </div>
        </div>

        <!-- Правая колонка: 4 карточки -->
       <aside class="sidebar">

    <!-- Верхний ряд: две карточки рядом -->
    <div class="sidebar-top">
        <div class="card">
            <h2>Текущие показатели</h2>
            <div class="metric">
                <span class="metric-label">Скорость</span>
                <span class="metric-value" id="m-speed">—</span>
            </div>
            <div class="metric">
                <span class="metric-label">Время в пути</span>
                <span class="metric-value" id="m-time">—</span>
            </div>
            <div class="metric">
                <span class="metric-label">Расход</span>
                <span class="metric-value" id="m-fuel">—</span>
            </div>
            <div class="metric">
                <span class="metric-label">Оптимальная скорость</span>
                <span class="metric-value" id="m-vopt">—</span>
            </div>
        </div>

        <div class="card">
            <h2>Маршрут</h2>
            <p class="loading">Загрузка данных...</p>
        </div>
    </div>

    <!-- График скорости -->
    <div class="chart-card">
        <h2>Скорость</h2>
        <div id="chart-speed" class="chart"></div>
    </div>

    <!-- График уклона -->
    <div class="chart-card">
        <h2>Уклон дороги</h2>
        <div id="chart-slope" class="chart"></div>
    </div>


    <!-- Спидометр -->
    <div class="chart-card speedometer-card">
        <h2>Спидометр</h2>
        <div class="speedometer">
            <svg viewBox="0 0 200 140" class="speedo-svg">
                <!-- Фоновая серая дуга (от 180° до 0°, через верх) -->
                <path d="M 20 110 A 80 80 0 0 1 180 110" 
                    fill="none" stroke="#E9EDC9" stroke-width="14" stroke-linecap="round"/>
                
                <!-- Зелёная зона: 0-60 км/ч (левый сегмент, от 180° до 144°) -->
                <path d="M 20 110 A 80 80 0 0 1 45 48" 
                    fill="none" stroke="#6B8E23" stroke-width="14" stroke-linecap="round"/>
                
                <!-- Жёлтая зона: 60-85 (от 144° до 108°) -->
                <path d="M 45 48 A 80 80 0 0 1 96 31" 
                    fill="none" stroke="#D4A72C" stroke-width="14" stroke-linecap="round"/>
                
                <!-- Красная зона: 85-120 (от 108° до 72°, правый сегмент) -->
                <path d="M 96 31 A 80 80 0 0 1 180 110" 
                    fill="none" stroke="#C97B5A" stroke-width="14" stroke-linecap="round"/>
                
                <!-- Стрелка (исходно направлена ВВЕРХ из центра) -->
                <g id="speedo-needle" transform="rotate(-90 100 110)">
                    <line x1="100" y1="110" x2="100" y2="70" 
                        stroke="#3A3A2E" stroke-width="3.5" stroke-linecap="round"/>
                </g>
                
                <!-- Центральная точка -->
                <circle cx="100" cy="110" r="7" fill="#3A3A2E"/>
                <circle cx="100" cy="110" r="3" fill="#FFFFFF"/>
                
                <!-- Метка оптимальной скорости (по умолчанию вне видимости) -->
                <circle id="speedo-opt-marker" cx="100" cy="30" r="6" 
                        fill="#FFFFFF" stroke="#6B8E23" stroke-width="3"/>
                
                <!-- Крупная цифра внизу под дугой -->
                <!-- Крупная цифра внутри дуги -->
                <text x="100" y="82" text-anchor="middle" 
                    font-size="32" font-weight="700" fill="#C97B5A"
                    id="speedo-value">0</text>
                <text x="100" y="98" text-anchor="middle" 
                    font-size="10" fill="#7A7A6E">км/ч</text>
            </svg>
            <!-- Подсказка внизу -->
            <div class="speedo-hint" id="speedo-hint">Ровный участок</div>
        </div>
    </div>
    </aside>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Plotly JS (для графиков) -->
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>

    <!-- Наш скрипт -->
    <script src="{{ url_for('static', filename='js/map.js') }}"></script>
</body>
</html>
